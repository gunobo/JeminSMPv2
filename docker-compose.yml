services:
  mc:
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "${MC_VERSION:-1.21.11}"
      MEMORY: "${MC_MEMORY:-4G}"
      TZ: "Asia/Seoul"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      SERVER_NAME: "${SERVER_NAME:-jeminSMPv2}"
      # 학교 등 모장 인증 핸드셰이크가 막힌 네트워크에서 접속해야 하면 .env에서 FALSE로.
      # 오프라인 모드여도 플러그인의 UUID 브릿지가 서버 쪽에서 실제 UUID/스킨을 조회해 고정하므로 기존 데이터 유지됨.
      ONLINE_MODE: "${ONLINE_MODE:-TRUE}"
      # 접속 제한 (테스트 서버용, 운영서버는 .env에서 비워두면 전체 오픈)
      WHITELIST: "${WHITELIST_NAMES:-}"
      ENFORCE_WHITELIST: "${ENFORCE_WHITELIST:-false}"
      OPS: "${OPS_NAMES:-}"
      # /data 안 플러그인 config.yml의 ${CFG_VAR} 를 아래 값들로 매 기동 시 치환
      # (itzg 이미지의 REPLACE_ENV_IN_PLACE 기본 프리픽스가 CFG_ 라서 CFG_ 로 넘김)
      REPLACE_ENV_IN_PLACE: "true"
      CFG_MYSQL_DATABASE: "${MYSQL_DATABASE:-jeminsmpv2}"
      CFG_MYSQL_USER: "${MYSQL_USER:-jeminsmpv2}"
      CFG_MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      CFG_DISCORD_ENABLED: "${DISCORD_ENABLED:-true}"
      CFG_DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN}"
      CFG_DISCORD_ADMIN_ROLE_ID: "${DISCORD_ADMIN_ROLE_ID}"
      CFG_DISCORD_CHANNEL_EVENTS: "${DISCORD_CHANNEL_EVENTS}"
      CFG_DISCORD_CHANNEL_CONSOLE: "${DISCORD_CHANNEL_CONSOLE}"
      CFG_GOOGLE_SHEETS_API_KEY: "${GOOGLE_SHEETS_API_KEY:-}"
      CFG_GOOGLE_SHEETS_SHEET_ID: "${GOOGLE_SHEETS_SHEET_ID:-}"
    ports:
      - "${MC_PORT:-25565}:25565"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ./target:/plugins-build:ro   # mvn package 결과물(jar)이 쌓이는 곳, 아래 plugins 로 수동 복사해서 씀
    depends_on:
      - mysql
    networks:
      - jeminsmp-net

  # 리소스팩 zip을 정적으로 서빙 (본서버 compose에서만 띄우면 됨, 테스트 서버도 같은 URL을 씀).
  # resourcepack-dist/ 안에 zip을 넣고 접속해서 http://<주소>:${RESOURCEPACK_PORT:-8080}/<zip 파일명> 으로 접근
  resourcepack:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${RESOURCEPACK_PORT:-8080}:80"
    volumes:
      - ./resourcepack-dist:/usr/share/nginx/html:ro
    networks:
      - jeminsmp-net

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-jeminsmpv2}"
      MYSQL_USER: "${MYSQL_USER:-jeminsmpv2}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - ${MYSQL_DATA_DIR:-./mysql-data}:/var/lib/mysql
    networks:
      - jeminsmp-net
    # 외부에 포트를 열 필요가 없으면 ports는 비워둔 채로 (mc 컨테이너는 네트워크 내부에서 mysql:3306 으로 접근)

networks:
  jeminsmp-net:
    driver: bridge
