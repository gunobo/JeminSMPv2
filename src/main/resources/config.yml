# UUID/스킨 캐시 DB 설정 (docker-compose의 mysql 서비스)
# 아래 ${CFG_...} 값들은 도커 컨테이너 기동 시 .env 값으로 자동 치환됩니다 (REPLACE_ENV_IN_PLACE,
# itzg 이미지 기본 프리픽스가 CFG_ 라서 그에 맞춤).
database:
  host: mysql
  port: 3306
  name: ${CFG_MYSQL_DATABASE}
  user: ${CFG_MYSQL_USER}
  password: "${CFG_MYSQL_PASSWORD}"

# Discord 봇 설정
discord:
  enabled: ${CFG_DISCORD_ENABLED}
  bot-token: "${CFG_DISCORD_BOT_TOKEN}"
  admin-role-id: "${CFG_DISCORD_ADMIN_ROLE_ID}"
  linked-role-id: ""   # 마크 연동 시 자동 부여할 디스코드 역할 ID (비워두면 역할 부여 안 함)
  command-prefix: "!"
  console-log-level: "WARNING"
  console-flush-interval-ticks: 100

  channels:
    events: "${CFG_DISCORD_CHANNEL_EVENTS}"
    console: "${CFG_DISCORD_CHANNEL_CONSOLE}"

  log:
    join: true
    quit: true
    chat: true
    death: true
    advancement: true
    server-start: true
    server-stop: true

# 운영 스케줄 설정
# false: 항상 닫힘(대기열) - OP는 예외, 디스코드 !opennow 로 수동 오픈해야 함
# true : 아래 slots 시간대에만 열림 (수업시간 등 자동 차단용)
schedule:
  enabled: false
  timezone: "Asia/Seoul"
  slots:
    # 예시: 평일 18:00~23:00, 주말 14:00~24:00
    # - days: "평일"
    #   start: "18:00"
    #   end: "23:00"
    # - days: "주말"
    #   start: "14:00"
    #   end: "24:00"

# 경고/징계 설정
warn:
  auto-punish-count: 3   # 경고 N회 누적 시 자동으로 대기열 징계

# Google Sheets 스케줄 연동 (선택)
google:
  sheets:
    enabled: false # true 로 바꾸면 자동 동기화 시작
    api-key: "${CFG_GOOGLE_SHEETS_API_KEY}" # Google Cloud API 키 (Sheets API v4 활성화 필요)
    sheet-id: "${CFG_GOOGLE_SHEETS_SHEET_ID}" # 스프레드시트 URL의 /d/<ID>/ 부분
    range: "B2:J10" # 그리드 형식 범위 (B=요일, C~J=시간대)
    sync-interval-minutes: 5 # 자동 동기화 주기 (분)
    service-account-file: "service-account.json" # 시트 자동 채우기용 서비스 계정 JSON

# 리소스팩 (직업 스킬템 아이콘 등). 비워두면 적용 안 함
resourcepack:
  url: ""   # 예: http://mcv2.imjemin.co.kr:8080/jeminsmp-resourcepack.zip

# SMP 설정
smp:
  world-name: "smp_world"
  scatter-radius: 2000

# 전투 태그 시간 (초)
combat-tag-seconds: 10

# AFK 설정
afk:
  timeout-minutes: 5

# 공지 설정
announcements:
  enabled: true
  interval-minutes: 5
  messages:
    - "&6[공지] &f서버 규칙을 지켜주세요!"
    - "&6[공지] &f엑스레이, 핵 사용은 영구 밴입니다."
    - "&6[공지] &f/스타터팩 으로 초보자 아이템을 받으세요!"
    - "&6[공지] &f/shop 으로 아이템을 사고 팔 수 있습니다."
    - "&6[공지] &f즐거운 게임 되세요! :)"
