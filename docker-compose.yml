services:
  mc:
    image: itzg/minecraft-server:latest
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "${MC_VERSION:-1.21.11}"
      MEMORY: "${MC_MEMORY:-4G}"
      TZ: "Asia/Seoul"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      SERVER_NAME: "${SERVER_NAME:-jeminSMPv2}"
      # 접속 제한 (테스트 서버용, 운영서버는 .env에서 비워두면 전체 오픈)
      WHITELIST: "${WHITELIST_NAMES:-}"
      ENFORCE_WHITELIST: "${ENFORCE_WHITELIST:-false}"
      OPS: "${OPS_NAMES:-}"
      # /data 안 플러그인 config.yml의 ${VAR} 를 아래 값들로 매 기동 시 치환
      REPLACE_ENV_IN_PLACE: "true"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-jeminsmpv2}"
      MYSQL_USER: "${MYSQL_USER:-jeminsmpv2}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      DISCORD_ENABLED: "${DISCORD_ENABLED:-true}"
      DISCORD_BOT_TOKEN: "${DISCORD_BOT_TOKEN}"
      DISCORD_ADMIN_ROLE_ID: "${DISCORD_ADMIN_ROLE_ID}"
      DISCORD_CHANNEL_EVENTS: "${DISCORD_CHANNEL_EVENTS}"
      DISCORD_CHANNEL_CONSOLE: "${DISCORD_CHANNEL_CONSOLE}"
      GOOGLE_SHEETS_API_KEY: "${GOOGLE_SHEETS_API_KEY:-}"
      GOOGLE_SHEETS_SHEET_ID: "${GOOGLE_SHEETS_SHEET_ID:-}"
    ports:
      - "${MC_PORT:-25565}:25565"
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ./target:/plugins-build:ro   # mvn package 결과물(jar)이 쌓이는 곳, 아래 plugins 로 수동 복사해서 씀
    depends_on:
      - mysql
    networks:
      - jeminsmp-net

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-jeminsmpv2}"
      MYSQL_USER: "${MYSQL_USER:-jeminsmpv2}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
    volumes:
      - ${MYSQL_DATA_DIR:-./mysql-data}:/var/lib/mysql
    networks:
      - jeminsmp-net
    # 외부에 포트를 열 필요가 없으면 ports는 비워둔 채로 (mc 컨테이너는 네트워크 내부에서 mysql:3306 으로 접근)

networks:
  jeminsmp-net:
    driver: bridge
