name: jeminSMPv1
version: "1.0"
main: jeminsmp.JeminSMPPlugin
api-version: "26.2"
description: jemin SMP 통합 플러그인

commands:
  # Home
  sethome:
    description: 홈 저장
    usage: /sethome [이름]
  home:
    description: 홈으로 이동
    usage: /home [이름]
  delhome:
    description: 홈 삭제
    usage: /delhome [이름]
  homes:
    description: 홈 목록
    usage: /homes
  mystatus:
    description: 플레이타임 · 킬 · 칭호 현황 확인
    usage: /mystatus
  # TPA
  tpa:
    description: 텔레포트 요청
    usage: /tpa <플레이어>
  tpaccept:
    description: 텔레포트 수락
    usage: /tpaccept
  tpdeny:
    description: 텔레포트 거절
    usage: /tpdeny
  # Team
  team:
    description: 팀 관리
    usage: /team <서브커맨드>
  tc:
    description: 팀 채팅
    usage: /tc <메시지>
  ec:
    description: 엔더상자 명령어 (팀 레벨 3 이상)
    usage: /ec
  # Nick
  nick:
    description: 닉네임 설정
    usage: /nick <닉네임>|reset
  # Kills
  kills:
    description: 킬 통계
    usage: /kills [top|reset]
  # Shop
  shop:
    description: 유저 상점
    usage: /shop
  우편함:
    description: 오프라인 다이아 수령
    usage: /우편함
  # Title
  title:
    description: 칭호 관리
    usage: /title <서브커맨드>
  balance:
    description: 잔액 확인
    usage: /balance
  eco:
    description: 경제 관리 (관리자)
    usage: /eco <give|take|set> <플레이어> <금액>
  # 웨이포인트
  wp:
    description: 웨이포인트 관리
    usage: /wp <add|list|tp|del|share> [이름]
  # 리더보드
  top:
    description: 순위 확인
    usage: /top <kills|deaths|kda|streak>
  # 거래
  거래:
    description: 플레이어 간 아이템 거래
    usage: /거래 <플레이어> | /거래 수락/거절/취소
  # 수학 퀴즈
  mathquiz:
    description: 수학 퀴즈 관리 (관리자)
    usage: /mathquiz [start|stop|status|reload]
  # 시즌
  season:
    description: 시즌 정보 및 관리
    usage: /season [info|start <이름>|end|top|history]
  # 스타터팩
  스타터팩:
    description: 스타터팩 지급 (구운소고기 64개)
    usage: /스타터팩
  # 수면 투표
  sleepvote:
    description: 밤 건너뛰기 투표
    usage: /sleepvote <yes|no>
  # 스케줄
  schedule:
    description: 서버 운영 스케줄 관리
    usage: /schedule [on|off|add|remove|status]
  # 경고/징계
  warn:
    description: 플레이어에게 경고 부여
    usage: /warn <플레이어> [사유]
  unwarn:
    description: 경고 삭제
    usage: /unwarn <플레이어> [번호]
  warnings:
    description: 경고 목록 조회
    usage: /warnings [플레이어]
  punish:
    description: 대기열 징계 적용
    usage: /punish <플레이어>
  unpunish:
    description: 징계 해제
    usage: /unpunish <플레이어>
  # 보상 수령
  claim:
    description: 보상 수령
    usage: /claim [id]
  # 디스코드 연동
  link:
    description: 디스코드 계정 연동
    usage: /link <코드>
  unlink:
    description: 디스코드 계정 연동 해제
    usage: /unlink
  # 유언
  유언:
    description: 유언 설정
    usage: /유언 [메시지|clear]
  # 편지
  편지:
    description: 편지 보내기
    usage: /편지 <닉네임> <메시지>
  편지함:
    description: 편지함 확인
    usage: /편지함
  # SMP
  startSMP:
    description: SMP 시작 (맵 초기화 + 랜덤 스폰)
    usage: /startSMP
    permission: jeminsmp.start

permissions:
  jeminsmp.start:
    description: SMP 시작 권한
    default: op
  jeminsmp.kills.reset:
    description: 킬 기록 초기화 권한
    default: op
